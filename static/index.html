<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce Analytics Chatbot</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:0 auto;padding:30px;background:#f6f7fb;color:#111}h1{margin-bottom:5px}.sub{color:#666}.chat{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;min-height:400px}.msg{padding:12px;margin:10px 0;border-radius:10px;white-space:pre-wrap}.user{background:#e9eefc}.bot{background:#f1f1f1}.row{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:16px}button{padding:13px 20px;border:0;border-radius:8px;cursor:pointer}.meta{font-size:12px;color:#777;margin-top:10px}.sql{background:#171717;color:#eee;padding:12px;border-radius:8px;overflow:auto;font-family:monospace;font-size:12px}.examples{margin:12px 0}.example{display:inline-block;background:#fff;border:1px solid #ddd;padding:7px 10px;border-radius:20px;margin:4px;cursor:pointer}</style></head>
<body><h1>Global E-Commerce Analytics Chatbot</h1><div class="sub">Natural language → structured intent → safe multi-table SQL → answer</div>
<div class="examples"><span class="example" onclick="ask(this.innerText)">Which country has the highest total spend?</span><span class="example" onclick="ask(this.innerText)">Show top 5 countries by transaction count</span><span class="example" onclick="ask(this.innerText)">What is the average order value by customer tier?</span><span class="example" onclick="ask(this.innerText)">What is customer 8745's total spend?</span></div>
<div id="chat" class="chat"></div><div class="row"><input id="q" placeholder="Ask a question about the e-commerce data..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Ask</button></div>
<script>const chat=document.getElementById('chat');const input=document.getElementById('q');const button=document.querySelector('button');function add(cls,text){let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function ask(x){input.value=x;send()}async function send(){let q=input.value.trim();if(!q)return;add('user',q);input.value='';button.disabled=true;try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});let d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');add('bot',d.answer);let m=document.createElement('div');m.className='meta';m.textContent='Structured query: '+JSON.stringify(d.spec);chat.appendChild(m);if(d.sql){let s=document.createElement('pre');s.className='sql';s.textContent=d.sql;chat.appendChild(s)}}catch(e){add('bot','Error: '+e.message)}finally{button.disabled=false;input.focus()}}add('bot','Hi! Ask me anything about customers, transactions, sessions, campaigns, or geo data.');</script></body></html>
